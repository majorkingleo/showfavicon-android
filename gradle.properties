# Gradle daemon: a small heap is enough for a single module app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only, no support library.
android.useAndroidX=true

# Official Kotlin formatting for the sources.
kotlin.code.style=official

# The build must run on JDK 17 or newer. The Android Gradle Plugin 9.4 requires
# at least 17, and JDK 25 is not supported by this AGP/Gradle combination yet,
# so pin the build to JDK 21 when the machine default is newer. Either switch
# the system default (`sudo archlinux-java set java-21-openjdk`) or uncomment:
# org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
